<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphone Screen Simulation</title>

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Smartphone Screen</h1>
    <div class="phone">
        <div class="bg Wavy"></div>
        <div class="statusbar">
            <div class="left">
                <span>09:00</span>
                <span class="material-symbols-outlined" aria-hidden="true">help</span>
                <span class="material-symbols-outlined" aria-hidden="true">video_library</span>
                <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
            </div>
            <div class="camera"></div>
            <div class="right">
                <span class="material-symbols-outlined" aria-hidden="true">signal_cellular_4_bar</span>
                <span class="material-symbols-outlined" aria-hidden="true">wifi</span>
                <span class="material-symbols-outlined" aria-hidden="true">battery_android_frame_full</span>
                <span class="battery-percentage">100%</span>
            </div>
        </div>

        <div class="apps">
            <div class="app app-files">
                <div class="icon">
                    <span class="material-symbols-outlined" aria-hidden="true">files</span>
                </div>
                <span class="label">Files</span>
            </div>
            <div class="app app-video">
                <div class="icon">
                    <span class="material-symbols-outlined" aria-hidden="true">slow_motion_video</span>
                </div>
                <span class="label">Video Player</span>
            </div>
            <div class="app app-game">
                <div class="icon">
                    <span class="material-symbols-outlined" aria-hidden="true">skateboarding</span>
                </div>
                <span class="label">Game</span>
            </div>
            <div class="app app-settings">
                <div class="icon">
                    <span class="material-symbols-outlined" aria-hidden="true">settings</span>
                </div>
                <span class="label">Settings</span>
            </div>
        </div>
    </div>
</body>

</html>
